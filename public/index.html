<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tr3al Banha | المباريات المتاحة</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .matches-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .match-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }
        .match-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }
        .match-teams {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }
        .match-teams span {
            color: var(--primary);
        }
        .match-info {
            color: #aaa;
            font-size: 0.95rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .team-logo {
            width: 50px;
            height: 50px;
            object-fit: contain;
            background: white;
            border-radius: 50%;
            padding: 5px;
        }
        .team-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            flex: 1;
        }
        .book-btn {
            background: var(--primary);
            color: var(--bg-dark);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            text-decoration: none;
            display: block;
            transition: all 0.3s ease;
        }
        .book-btn:hover {
            background: white;
            transform: scale(1.02);
        }
        .book-btn.disabled {
            background: #555;
            color: #888;
            cursor: not-allowed;
            transform: none;
        }
        .loading-matches {
            text-align: center;
            color: #aaa;
            padding: 40px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Tr3al Banha</h1>
            <p>اختر المباراة التي تود حضورها لدعم فريقك!</p>
        </div>

        <div id="loadingMatches" class="loading-matches">
            <i class="fas fa-spinner fa-spin fa-2x"></i>
            <p>جاري تحميل المباريات المتاحة...</p>
        </div>

        <div id="matchesContainer" class="matches-container" style="display: none;">
            <!-- Matches will be loaded here dynamically -->
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const matchesContainer = document.getElementById('matchesContainer');
            const loadingMatches = document.getElementById('loadingMatches');

            try {
                const response = await fetch('/api/matches');
                const data = await response.json();

                loadingMatches.style.display = 'none';
                matchesContainer.style.display = 'grid';

                if (data.success && data.matches.length > 0) {
                    matchesContainer.innerHTML = data.matches.map(match => {
                        const isClosed = match.status !== 'Active';
                        
                        // Helper to get logo URL
                        const getLogo = (name) => {
                            if (name.includes('أهلي') || name.includes('اهلي')) {
                                return 'ahly-logo.png';
                            }
                            if (name.includes('برشلونة')) {
                                return 'barca-logo.png';
                            }
                            // Default fallback
                            return 'https://cdn-icons-png.flaticon.com/512/33/33736.png';
                        };

                        return `
                            <div class="match-card">
                                <div class="match-teams">
                                    <div class="team-container">
                                        <img src="${getLogo(match.teamA)}" class="team-logo" alt="${match.teamA}">
                                        <span>${match.teamA}</span>
                                    </div>
                                    <span style="font-size: 0.8rem; color: #555;">VS</span>
                                    <div class="team-container">
                                        <img src="${getLogo(match.teamB)}" class="team-logo" alt="${match.teamB}">
                                        <span>${match.teamB}</span>
                                    </div>
                                </div>
                                <div class="match-info">
                                    <i class="far fa-calendar-alt"></i> ${match.date}
                                </div>
                                <div class="match-info">
                                    <i class="far fa-clock"></i> ${match.time}
                                </div>
                                <div class="match-info">
                                    <i class="fas fa-map-marker-alt"></i> ${match.location}
                                </div>
                                
                                ${isClosed 
                                    ? '<button class="book-btn disabled" disabled>الحجز مغلق</button>'
                                    : `<a href="book.html?matchId=${match.id}" class="book-btn">احجز الآن</a>`
                                }
                            </div>
                        `;
                    }).join('');
                } else {
                    matchesContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; color: #aaa;">لا توجد مباريات متاحة حالياً.</div>';
                }
            } catch (error) {
                console.error('Error fetching matches:', error);
                loadingMatches.innerHTML = '<p style="color: var(--danger);">حدث خطأ أثناء تحميل المباريات. يرجى المحاولة لاحقاً.</p>';
            }
        });
    </script>
</body>
</html>
